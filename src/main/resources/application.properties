#Spring Boot Application Name
spring.application.name=stocktrack-backend

# Perfil por defecto en local; Docker/Render usan prod (Dockerfile o SPRING_PROFILES_ACTIVE)
spring.profiles.default=dev

#Spring Data JPA Hibernate Configuration (compartido entre perfiles)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.connection.autocommit=false
spring.jpa.hibernate.naming.physical-strategy=com.inventiapp.stocktrack.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

#OpenAPI Documentation Configuration
documentation.application.description=StockWise Backend API - Sistema de gestion de inventario
documentation.application.version=1.0.0


# JWT Configuration Properties

# Custom Properties for JWT
# suppress inspection "SpringBootApplicationProperties"
authorization.jwt.secret = WriteHereYourSecretStringForTokenSigningCredentials
# suppress inspection "SpringBootApplicationProperties"
authorization.jwt.expiration.days = 7

server.port=${PORT:8080}
# JWT (lee de env; usa valor por defecto solo en desarrollo)
# authorization.jwt.secret=${JWT_SECRET:WriteHereYourSecretStringForTokenSigningCredentials}
